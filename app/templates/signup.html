<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="{{ url_for('static', filename='images/favicon_krafton.ico') }}" type="image/x-icon">
  <title>회원가입</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex flex-col justify-center items-center min-h-screen">

  <!-- 네비게이션 -->
  <nav class="w-full bg-white shadow-md py-4 px-6 flex items-center fixed top-0 left-0">
    <a href="/" class="flex items-center">
        <img src="{{ url_for('static', filename='images/krafton_basic.jpg') }}" alt="Logo" class="h-10">
    </a>
  </nav>

  <div class="w-full flex justify-center mt-24">
        <img src="{{ url_for('static', filename='images/company_logo.png') }}" alt="Company Logo" class="h-20">
  </div>

  <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-sm text-center mt-8">
    <img src="{{ url_for('static', filename='images/welcometothejungle.jpg') }}" alt="Welcome" class="w-full mb-4">
    <h1 class="text-2xl font-bold mb-6">회원가입</h1>
    
    <!-- Flash 메시지 표시 -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="mb-4">
          {% for category, message in messages %}
            <div class="text-sm {{ 'text-green-500' if category=='success' else 'text-red-500' }}">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}


    <!-- POST-Redirect-GET용 form -->
    <form method="POST" action="{{ url_for('auth_bp.signup') }}">
      <input
        type="text"
        name="username"
        placeholder="아이디"
        class="w-full px-4 py-2 mb-4 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        required
      />
      <input
        type="password"
        name="password"
        placeholder="비밀번호"
        class="w-full px-4 py-2 mb-4 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        required
      />
      <input
        type="text"
        name="phone"
        placeholder="전화번호"
        class="w-full px-4 py-2 mb-4 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        required
      />
      <button
        type="submit"
        class="w-full py-2 px-4 bg-blue-500 text-white rounded-md hover:bg-blue-600 focus:outline-none"
      >
        가입완료
      </button>
    </form>

    <p class="mt-4 text-sm">
      이미 계정이 있으신가요? 
      <a href="{{ url_for('auth_bp.show_signin') }}" class="text-blue-500 hover:underline">로그인</a>
    </p>
  </div>
</body>
</html>
